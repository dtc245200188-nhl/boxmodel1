<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container chỉ chứa 3 thẻ để :nth-child(1/2/3) chọn đúng từng thẻ -->
    <div class="container">
        <div class="card">
            <strong>Thẻ 1: content-box</strong><br>
            Tổng: 330 x 200px
        </div>
        <div class="card">
            <strong>Thẻ 2: border-box</strong><br>
            Tổng: 280 x 150px
        </div>
        <div class="card">
            <strong>Thẻ 3: border-box</strong><br>
            Tổng: 280 x 150px
        </div>
    </div>
</body>
</html>
